<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#17583d">
  <meta name="color-scheme" content="light">
  <title>정통 맞고 (GOSTOP) - 모바일 1:1 대전</title>
  <script>
    window.__CONSOLE_ERRORS__ = [];
    window.onerror = function (message, source, lineno, colno, error) {
      window.__CONSOLE_ERRORS__.push({ message, source, lineno, colno });
      console.error('Captured Global Error:', message, lineno);
    };
  </script>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <!-- 메인 게임 애플리케이션 -->
  <div id="game-app">
    <!-- 상단 유틸리티 바 -->
    <header class="top-bar">
      <div class="game-title">
        <span>🎴 정통 맞고 1:1</span>
        <span id="turn-indicator"
          style="font-size: 11px; color: #a7f3d0; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 10px;">내
          턴</span>
      </div>
      <div class="util-buttons">
        <div class="stake-dropdown-wrap">
          <button id="btn-stake" class="btn-icon" style="color: #facc15; font-weight: 500;"
            title="1점당 판돈 선택 (1천원 ~ 10만원)">💰 점당: 1천원 ▾</button>
          <div id="stake-menu" class="stake-menu hidden">
            <button class="stake-item active" data-stake="1000">1점 1,000원</button>
            <button class="stake-item" data-stake="2000">1점 2,000원</button>
            <button class="stake-item" data-stake="5000">1점 5,000원</button>
            <button class="stake-item" data-stake="10000">1점 1만원</button>
            <button class="stake-item" data-stake="50000">1점 5만원</button>
            <button class="stake-item" data-stake="100000">1점 10만원</button>
          </div>
        </div>
        <button id="btn-speed" class="btn-icon" style="color: #ffd166; font-weight: 500;"
          title="게임 진행 속도 변경 (1x, 2x, 3x)">⚡ 속도 1x</button>
        <button id="btn-kookjin-toggle" class="btn-icon" title="국진 열끗을 쌍피로 전환">🌸 국진: 열끗</button>
        <button id="btn-sound" class="btn-icon">🔊 소리 켬</button>
        <button id="btn-fullscreen" class="btn-icon">⛶ 전체화면</button>
        <button id="btn-restart" class="btn-icon">🔄 새로고침</button>
      </div>
    </header>

    <!-- 게임 테이블 매트 -->
    <main class="game-table">
      <!-- 1. 상대방(컴퓨터) 정보 & 손패 & 획득패 영역 -->
      <section class="opponent-row">
        <!-- 상대방 프로필 -->
        <div class="profile-card">
          <div class="profile-avatar">🤖</div>
          <div class="profile-info">
            <span class="profile-name">타짜 AI <span id="opp-status-badge"
                style="font-size: 10px; color: #f87171;"></span></span>
            <span class="profile-money" id="opp-money">100,000원</span>
          </div>
          <div class="score-badge">
            <div class="score-val" id="opp-score">0</div>
            <div class="score-lbl">점수</div>
          </div>
        </div>

        <!-- 상대방 손패 (뒷면 카드 10장~0장 실시간 시각화) -->
        <div class="opp-hand-container" id="opp-hand" title="상대방 남은 손패">
          <!-- 상대 손패 뒷면 미니 카드 동적 렌더링 -->
        </div>

        <!-- 상대방 획득패 (광 / 열 / 띠 / 피 + 족보 현황 배지) -->
        <div class="captured-panel" id="opp-captured" title="터치하여 상세 보기">
          <div class="captured-group" data-group="kwang">
            <div class="group-header">
              <span class="group-title">광 (<span id="opp-cnt-kwang">0</span>)</span>
              <span class="group-chip" id="opp-chip-kwang"></span>
            </div>
            <div class="group-cards" id="opp-cap-kwang"></div>
          </div>
          <div class="captured-group" data-group="ten">
            <div class="group-header">
              <span class="group-title">열 (<span id="opp-cnt-ten">0</span>)</span>
              <span class="group-chip" id="opp-chip-ten"></span>
            </div>
            <div class="group-cards" id="opp-cap-ten"></div>
          </div>
          <div class="captured-group" data-group="rib">
            <div class="group-header">
              <span class="group-title">띠 (<span id="opp-cnt-rib">0</span>)</span>
              <span class="group-chip" id="opp-chip-rib"></span>
            </div>
            <div class="group-cards" id="opp-cap-rib"></div>
          </div>
          <div class="captured-group" data-group="pi">
            <div class="group-header">
              <span class="group-title">피 (<span id="opp-cnt-pi">0</span>)</span>
              <span class="group-chip" id="opp-chip-pi"></span>
            </div>
            <div class="group-cards" id="opp-cap-pi"></div>
          </div>
        </div>
      </section>

      <!-- 2. 중앙 필드: 중앙 덱 + 바닥패 영역 (최대 12~14장) -->
      <section class="field-row">
        <!-- 중앙 덱 영역 -->
        <div class="deck-area">
          <div class="deck-stack" id="deck-stack">
            <!-- 덱 렌더링 레이어 -->
          </div>
          <span class="deck-count" id="deck-count">덱 22장</span>
        </div>

        <!-- 바닥패 판 (월별 슬롯) -->
        <div class="field-board" id="field-board">
          <!-- 12개 월별 슬롯 동적 생성 -->
        </div>
      </section>

      <!-- 3. 하단 플레이어: 내 프로필 + 내 획득패 + 내 손패(10장) -->
      <section class="player-row">
        <div class="player-status-bar">
          <!-- 내 프로필 & 점수 (좌측 배치로 덱과의 겹침 방지) -->
          <div class="profile-card">
            <div class="profile-avatar" style="background: linear-gradient(135deg, #1d3557, #457b9d);">🧑</div>
            <div class="profile-info">
              <span class="profile-name">나 (플레이어) <span id="player-status-badge"
                  style="font-size: 10px; color: #ffd166;"></span></span>
              <span class="profile-money" id="player-money">100,000원</span>
            </div>
            <div class="score-badge">
              <div class="score-val" id="player-score">0</div>
              <div class="score-lbl">점수</div>
            </div>
          </div>

          <!-- 내 획득패 (광 / 열 / 띠 / 피 + 족보 현황 배지) -->
          <div class="captured-panel" id="player-captured" title="터치하여 상세 보기">
            <div class="captured-group" data-group="kwang">
              <div class="group-header">
                <span class="group-title">광 (<span id="player-cnt-kwang">0</span>)</span>
                <span class="group-chip" id="player-chip-kwang"></span>
              </div>
              <div class="group-cards" id="player-cap-kwang"></div>
            </div>
            <div class="captured-group" data-group="ten">
              <div class="group-header">
                <span class="group-title">열 (<span id="player-cnt-ten">0</span>)</span>
                <span class="group-chip" id="player-chip-ten"></span>
              </div>
              <div class="group-cards" id="player-cap-ten"></div>
            </div>
            <div class="captured-group" data-group="rib">
              <div class="group-header">
                <span class="group-title">띠 (<span id="player-cnt-rib">0</span>)</span>
                <span class="group-chip" id="player-chip-rib"></span>
              </div>
              <div class="group-cards" id="player-cap-rib"></div>
            </div>
            <div class="captured-group" data-group="pi">
              <div class="group-header">
                <span class="group-title">피 (<span id="player-cnt-pi">0</span>)</span>
                <span class="group-chip" id="player-chip-pi"></span>
              </div>
              <div class="group-cards" id="player-cap-pi"></div>
            </div>
          </div>
        </div>

        <!-- 내 손패 영역 (10장) -->
        <div class="player-hand-container" id="player-hand">
          <!-- 손패 카드 슬롯 동적 렌더링 -->
        </div>
      </section>
    </main>

    <!-- 특수 이펙트 배너 (쪽, 따닥, 쓸, 뻑, 폭탄) -->
    <div id="effect-banner"></div>

    <!-- 모달 1: 고(GO) / 스톱(STOP) 선택 모달 -->
    <div class="modal-overlay" id="modal-gostop">
      <div class="modal-box">
        <h2 class="modal-title" id="gostop-title">🎴 7점 달성!</h2>
        <p class="modal-desc" id="gostop-desc">현재 <b id="gostop-score-val"
            style="color:#ffd166; font-size:18px;">7</b>점입니다. 계속 진행(고)하시겠습니까, 승리(스톱)하시겠습니까?</p>
        <div class="go-stop-buttons">
          <button id="btn-declare-go" class="btn-gostop btn-go">🔥 고 (GO)</button>
          <button id="btn-declare-stop" class="btn-gostop btn-stop">🛑 스톱 (STOP)</button>
        </div>
      </div>
    </div>

    <!-- 모달 2: 바닥패 2장 중 1장 선택 모달 -->
    <div class="modal-overlay" id="modal-choice">
      <div class="modal-box">
        <h2 class="modal-title">가져갈 패를 선택하세요</h2>
        <p class="modal-desc">바닥에 같은 월의 패가 2장 있습니다. 가져갈 패를 터치하세요.</p>
        <div class="choice-cards-container" id="choice-cards-list">
          <!-- 선택 대상 카드 2장 -->
        </div>
      </div>
    </div>

    <!-- 모달 3: 게임 종료 정산 결과 모달 -->
    <div class="modal-overlay" id="modal-result">
      <div class="modal-box" style="min-width: 320px;">
        <h2 class="modal-title" id="result-title">승리! 🎉</h2>
        <p class="modal-desc" id="result-winner-desc"></p>

        <div class="result-score-list" id="result-score-breakdown">
          <!-- 점수 및 배수 내역 -->
        </div>

        <button id="btn-next-round" class="btn-gostop btn-go" style="font-size: 16px; padding: 12px 28px;">다음 판 시작하기
          🎴</button>
      </div>
    </div>

    <!-- 모달 4: 흔들기 / 폭탄 선택 모달 -->
    <div class="modal-overlay" id="modal-shake">
      <div class="modal-box">
        <h2 class="modal-title">⚡ 흔들기 또는 폭탄</h2>
        <p class="modal-desc" id="shake-desc">손패에 같은 월의 패가 3장 있습니다!</p>
        <div class="go-stop-buttons">
          <button id="btn-do-shake" class="btn-gostop btn-go" style="font-size: 17px; padding: 10px 24px;">흔들기
            (2배)</button>
          <button id="btn-skip-shake" class="btn-gostop btn-stop" style="font-size: 17px; padding: 10px 24px;">그냥
            진행</button>
        </div>
      </div>
    </div>

    <!-- 모달 5: 획득패 확대 상세 보기 모달 (모바일 최적화) -->
    <div class="modal-overlay" id="modal-captured-detail">
      <div class="modal-box captured-detail-box">
        <div class="captured-detail-header">
          <h2 class="modal-title" id="cap-detail-title">🎴 획득패 상세 보기</h2>
          <button id="btn-close-cap-detail" class="btn-icon" style="padding: 4px 10px; font-size: 14px;">✕ 닫기</button>
        </div>
        <p class="modal-desc" id="cap-detail-summary" style="font-size: 13px; color: #ffd166; margin: 4px 0 10px;"></p>
        <div class="captured-detail-cards" id="cap-detail-cards-list">
          <!-- 획득한 카드들이 큰 크기로 나열됨 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 스크립트 파일 로드 -->
  <script src="./js/cards.js"></script>
  <script src="./js/sound.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/ai.js"></script>
  <script src="./js/app.js"></script>
</body>

</html>
